# RSSkyler Limo — nginx front end.
#
# Three processes behind one nginx: the public site on :3000, the dashboard on
# :3001, and the API on :4000. Only the first two are exposed. Certificates are
# issued by Cloudflare or Let's Encrypt; the TLS directives below assume
# certbot's managed snippets.
#
# The API deliberately has no server block. It listens on 127.0.0.1 and is
# reached only by the two Next.js servers, from the same host.

upstream rsskyler_web   { server 127.0.0.1:3000; keepalive 16; }
upstream rsskyler_admin { server 127.0.0.1:3001; keepalive 16; }

# --- Public site ------------------------------------------------------------

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rsskylerlimo.com www.rsskylerlimo.com;

    ssl_certificate     /etc/letsencrypt/live/rsskylerlimo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rsskylerlimo.com/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://rsskyler_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The booking form forwards this to the API's rate limiter, so a
        # missing header means every visitor shares one bucket.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# --- Reservations dashboard -------------------------------------------------

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.rsskylerlimo.com;

    ssl_certificate     /etc/letsencrypt/live/admin.rsskylerlimo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.rsskylerlimo.com/privkey.pem;

    # This host serves customer names, phone numbers and home addresses. Keep it
    # out of every index and every referrer, whatever a page forgets to set.
    add_header X-Robots-Tag        "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy     "same-origin" always;
    add_header X-Frame-Options     "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Optional, and worth doing: the dashboard has no reason to be reachable
    # from outside the office or the VPN. Uncomment and set real ranges.
    # allow 203.0.113.0/24;
    # deny all;

    location / {
        proxy_pass http://rsskyler_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# --- Redirect plain HTTP ----------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name rsskylerlimo.com www.rsskylerlimo.com admin.rsskylerlimo.com;
    return 301 https://$host$request_uri;
}
