# RSSkyler Limo — nginx front end.
#
# Three processes behind one nginx: the public site on :3000, the dashboard on
# :3001, and the API on :4000. Only the first two are exposed. Certificates are
# issued by Cloudflare or Let's Encrypt; the TLS directives below assume
# certbot's managed snippets.
#
# The API deliberately has no server block. It listens on 127.0.0.1 and is
# reached only by the two Next.js servers, from the same host.

upstream rsskyler_web   { server 127.0.0.1:3000; keepalive 16; }
upstream rsskyler_admin { server 127.0.0.1:3001; keepalive 16; }

# --- Canonical host: apex redirects to www ----------------------------------
#
# Exactly one hostname may answer 200 for the public site. Serving both the
# apex and `www` from one block is the default way a marketing site ends up
# with two indexable copies of every page, splitting its own link equity.
#
# `www` is canonical here — it matches `SITE_BASE_URL`, `metadataBase` in
# `src/app/layout.tsx`, and the URLs in `sitemap.ts`. Change one and change all
# four, or the site advertises a URL that redirects.
#
# 301, not 302: a permanent redirect is what transfers ranking signals. The
# certificate must cover the apex too, otherwise the browser fails on the TLS
# handshake before it is ever told to go elsewhere.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rsskylerlimo.com;

    ssl_certificate     /etc/letsencrypt/live/rsskylerlimo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rsskylerlimo.com/privkey.pem;

    return 301 https://www.rsskylerlimo.com$request_uri;
}

# --- Public site ------------------------------------------------------------

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.rsskylerlimo.com;

    ssl_certificate     /etc/letsencrypt/live/rsskylerlimo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rsskylerlimo.com/privkey.pem;

    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Uploaded vehicle photography, served straight off disk rather than
    # through Node. `Cross-Origin-Resource-Policy` is relaxed here so the
    # dashboard on admin.rsskylerlimo.com can render the same files in an
    # <img>; everything else keeps the default.
    location /uploads/ {
        alias /var/lib/rsskyler/uploads/;
        access_log off;
        # Filenames are content-addressed on upload, so they never change.
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://rsskyler_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The booking form forwards this to the API's rate limiter, so a
        # missing header means every visitor shares one bucket.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# --- Reservations dashboard -------------------------------------------------

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.rsskylerlimo.com;

    ssl_certificate     /etc/letsencrypt/live/admin.rsskylerlimo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.rsskylerlimo.com/privkey.pem;

    # This host serves customer names, phone numbers and home addresses. Keep it
    # out of every index and every referrer, whatever a page forgets to set.
    add_header X-Robots-Tag        "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy     "same-origin" always;
    add_header X-Frame-Options     "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Optional, and worth doing: the dashboard has no reason to be reachable
    # from outside the office or the VPN. Uncomment and set real ranges.
    # allow 203.0.113.0/24;
    # deny all;

    location / {
        proxy_pass http://rsskyler_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# --- Redirect plain HTTP ----------------------------------------------------
#
# The apex is named separately so that `http://rsskylerlimo.com/x` reaches
# `https://www.rsskylerlimo.com/x` in one hop. Sending it to `https://$host`
# first would cost a second redirect on every plain-HTTP arrival — which is
# what a typed address, an old business card and most QR codes still are.

server {
    listen 80;
    listen [::]:80;
    server_name rsskylerlimo.com;
    return 301 https://www.rsskylerlimo.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.rsskylerlimo.com admin.rsskylerlimo.com;
    return 301 https://$host$request_uri;
}
